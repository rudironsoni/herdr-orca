name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:plugin
        env:
          PLUGIN_VERSION: ${{ needs.release-please.outputs.tag_name }}
      - name: Upload plugin zip to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/herdr-orca-*-plugin.zip --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-orca-release-${{ needs.release-please.outputs.tag_name }}
          path: dist/herdr-orca-*-plugin.zip
          if-no-files-found: error
          retention-days: 90
